name: Release

# Each release has one standalone Windows x64 download: Rig.exe.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare pinned capture engine
        run: ./scripts/Prepare-CaptureEngine.ps1

      - name: Check the tag matches the app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ([xml](Get-Content Rig/Rig.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Rig.csproj says $version but the tag is $env:RELEASE_TAG" }

      - name: Build and test
        run: |
          dotnet build Rig -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Rig.Tests -c Release --filter "Category!=Desktop"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish standalone Rig
        run: dotnet publish Rig -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/rig

      - name: Prepare the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/rig/Rig.exe dist/Rig.exe
          $version = (Get-Item dist/Rig.exe).VersionInfo.ProductVersion.Split('+')[0]
          $expected = ([xml](Get-Content Rig/Rig.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($version -ne $expected) { throw "Built EXE version $version does not match $expected" }
          Get-FileHash dist/Rig.exe -Algorithm SHA256

      # An optional detached signature is verification data, not a second app edition.
      - name: Sign Rig when a release key is configured
        shell: pwsh
        env:
          RIG_SIGNING_KEY: ${{ secrets.RIG_SIGNING_KEY }}
        run: |
          if (-not $env:RIG_SIGNING_KEY) { "No signing key configured; Rig.exe is unsigned."; exit 0 }
          $key = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $key.ImportFromPem($env:RIG_SIGNING_KEY)
            $stream = [IO.File]::OpenRead((Resolve-Path dist/Rig.exe))
            try { $sig = $key.SignData($stream, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation) }
            finally { $stream.Dispose() }
            [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'Rig.exe.sig'), [Convert]::ToBase64String($sig))
          } finally { $key.Dispose() }

      - name: Publish Rig
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Write release notes at $notes before publishing." }
          gh release view $tag --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            gh release edit $tag --draft --title "Rig $($tag.TrimStart('v'))" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not stage the release update.' }
            $uploadArgs = @('release', 'upload', $tag, '--clobber')
            $uploadArgs += Get-ChildItem dist -File | ForEach-Object { $_.FullName }
            gh @uploadArgs
          } else {
            $releaseArgs = @('release', 'create', $tag, '--verify-tag', '--draft', '--title', "Rig $($tag.TrimStart('v'))", '--notes-file', $notes)
            $releaseArgs += Get-ChildItem dist -File | ForEach-Object { $_.FullName }
            gh @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the release.' }
          if ($tag.Contains('-')) { gh release edit $tag --draft=false --prerelease }
          else { gh release edit $tag --draft=false --latest }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
