name: Release

# Push a tag like v1.4.0 (matching <Version> in PCOptimizer.csproj) to build and publish both EXEs.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content PCOptimizer/PCOptimizer.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "PCOptimizer.csproj says $version but the tag is ${{ github.ref_name }}" }

      - name: Build full (self-contained) EXE
        run: dotnet publish PCOptimizer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/full

      - name: Build lite EXE
        run: dotnet publish PCOptimizer -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o out/lite

      - name: Name the assets (the in-app updater looks for these names)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/full/PCOptimizer.exe dist/PCOptimizer.exe
          Copy-Item out/lite/PCOptimizer.exe dist/PCOptimizer-lite.exe
          Get-ChildItem dist | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $ghArgs = @('release', 'create', $tag, 'dist/PCOptimizer.exe', 'dist/PCOptimizer-lite.exe', '--title', "PC Optimizer $tag", '--latest')
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          gh @ghArgs
