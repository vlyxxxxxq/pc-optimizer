name: Release

# Push a tag like v2.0.0 (matching <Version> in Rig.csproj) to build and publish both EXEs.
# A tag with a suffix (v2.0.0-beta.1) is published as a pre-release, which only beta-channel users are offered.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Rig/Rig.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Rig.csproj says $version but the tag is ${{ github.ref_name }}" }

      - name: Build full (self-contained) EXE
        run: dotnet publish Rig -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/full

      - name: Build lite EXE
        run: dotnet publish Rig -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o out/lite

      - name: Name the assets (the in-app updater looks for these names)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item out/full/Rig.exe dist/Rig.exe
          Copy-Item out/lite/Rig.exe dist/Rig-lite.exe
          # PC Optimizer 1.x looks for these names, so it can update itself into Rig.
          Copy-Item out/full/Rig.exe dist/PCOptimizer.exe
          Copy-Item out/lite/Rig.exe dist/PCOptimizer-lite.exe
          Get-ChildItem dist | ForEach-Object { "{0} {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      # Detached signatures for the updater (docs/SIGNING.md). Skipped until the RIG_SIGNING_KEY secret exists;
      # Rig only requires them once its embedded public key (Updater.SigningKey) is set.
      - name: Sign the assets
        shell: pwsh
        env:
          RIG_SIGNING_KEY: ${{ secrets.RIG_SIGNING_KEY }}
        run: |
          if (-not $env:RIG_SIGNING_KEY) { "No signing key configured; releases are unsigned."; exit 0 }
          $key = [System.Security.Cryptography.ECDsa]::Create()
          $key.ImportFromPem($env:RIG_SIGNING_KEY)
          foreach ($f in Get-ChildItem dist -Filter *.exe) {
            $stream = [IO.File]::OpenRead($f.FullName)
            try { $sig = $key.SignData($stream, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.DSASignatureFormat]::IeeeP1363FixedFieldConcatenation) }
            finally { $stream.Dispose() }
            [IO.File]::WriteAllText("$($f.FullName).sig", [Convert]::ToBase64String($sig))
            "Signed $($f.Name)"
          }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $ghArgs = @('release', 'create', $tag) + (Get-ChildItem dist | ForEach-Object { $_.FullName }) + @('--title', "Rig $tag")
          $ghArgs += $(if ($tag.Contains('-')) { '--prerelease' } else { '--latest' })
          if (Test-Path $notes) { $ghArgs += @('--notes-file', $notes) } else { $ghArgs += '--generate-notes' }
          gh @ghArgs
