name: Suggest an improvement
description: An idea to make Rig more useful or easier to use.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the task or frustration, and which part of Rig it affects.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Describe the behavior you would like, or share an example.
    validations:
      required: true
