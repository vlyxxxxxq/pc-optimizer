<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Rig — Your PC, at your fingertips.</title>
  <desc id="desc">A native Windows toolkit for gaming, everyday tasks, and a tidier PC.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111720"/><stop offset="1" stop-color="#11121b"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82b2ff"/><stop offset="1" stop-color="#436eea"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#416ede" stop-opacity=".22"/><stop offset="1" stop-color="#416ede" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#background)"/>
  <ellipse cx="1120" cy="120" rx="450" ry="300" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1279" height="359" rx="22" fill="none" stroke="#2a3345"/>
  <g transform="translate(64 58)">
    <rect width="62" height="62" rx="18" fill="url(#blue)"/>
    <g transform="translate(6 6) scale(1.39)" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round">
      <path d="M10.65 26.75 A10.4 10.4 0 1 1 25.35 26.75"/><path d="m18 19.4 6.2-5.2"/><circle cx="18" cy="19.4" r="1.7" fill="#fff" stroke="none"/>
    </g>
    <text x="82" y="45" fill="#eef3ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">Rig</text>
  </g>
  <text x="64" y="195" fill="#f4f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="600" letter-spacing="-.8">Your PC, at your fingertips.</text>
  <text x="66" y="237" fill="#a4aec5" font-family="Segoe UI,Arial,sans-serif" font-size="20">Gaming. Everyday tools. A little less clutter.</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#bdc9e0">
    <rect x="65" y="281" width="118" height="29" rx="14.5" fill="#1d2738"/><text x="84" y="300">WINDOWS 10 / 11</text>
    <rect x="194" y="281" width="96" height="29" rx="14.5" fill="#1d2738"/><text x="214" y="300">ONE .EXE</text>
    <rect x="301" y="281" width="158" height="29" rx="14.5" fill="#1d2738"/><text x="320" y="300">INSTALL OR PORTABLE</text>
  </g>
  <g transform="translate(920 73)" fill="none" stroke="#6a92ed">
    <circle cx="125" cy="110" r="108" stroke-opacity=".13"/>
    <circle cx="125" cy="110" r="82" stroke-opacity=".19"/>
    <path d="M66 171 A84 84 0 1 1 184 171" stroke-width="9" stroke-linecap="round" stroke-opacity=".55"/>
    <path d="m125 110 44-42" stroke="#95b7ff" stroke-width="9" stroke-linecap="round"/>
    <circle cx="125" cy="110" r="11" fill="#95b7ff" stroke="none"/>
    <circle cx="54" cy="34" r="4" fill="#7aa5ff" stroke="none"/>
  </g>
</svg>
